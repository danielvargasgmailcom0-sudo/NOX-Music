
name: Construir VIOLET Music

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Gradle 8.13
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validar manifiesto
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifiesto XML correcto')"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VIOLET-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
