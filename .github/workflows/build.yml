
name: Construir NOX Music

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar XML del manifiesto
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML correcto')"

      - name: Compilar APK con detalles
        run: gradle assembleDebug --stacktrace --info

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
